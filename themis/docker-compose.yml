version: '3.8'

services:
  # PostgreSQL - relational storage for multi-tenant identity and audit log.
  postgres:
    image: postgres:16-alpine
    container_name: themis-postgres
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_secret
      POSTGRES_DB: olympus_themis
    ports:
      - "15439:5432"
    volumes:
      - themis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus_themis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  themis-postgres-data:
    driver: local
