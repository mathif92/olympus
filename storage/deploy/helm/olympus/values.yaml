# --- OlympusStore gateway ---
image:
  repository: olympus/olympus
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

# Storage backend to use: local | hybrid | minio
# Defaults to "minio" when minio.enabled=true, otherwise "hybrid".
storageBackend: ""

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: olympus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false

storage:
  baseDir: /data

config:
  poolMax: 20
  poolMin: 5
  poolTimeoutMs: 30000

# --- Periodic metadata/content reconciliation ---
# A Gateway CronJob that compares the Postgres index against physical MinIO
# objects and heals drift. Run once with `make backfill-etag` / `kubectl create
# job --from` after upgrading existing deployments that predate drift-tracking.
reconciliation:
  enabled: true
  schedule: "30 3 * * *" # daily at 03:30 (default timezone unless timeZone set)
  timezone: ""
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  purgeOrphans: false
  markMissing: true
  repairDrift: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- PostgreSQL (metadata) ---
# The gateway applies goose migrations on startup against this database.
postgresql:
  dsn: ""
  host: postgres
  port: 5432
  dbname: olympus_storage
  user: olympus
  password: olympus_secret
  existingSecret: ""
  existingSecretKey: ""

# --- Redis (cache) ---
redis:
  url: redis://redis:6379

# --- MinIO (the storage-workers) ---
# When enabled, a distributed MinIO StatefulSet backs object storage. Point this
# chart at an externally-managed MinIO cluster instead by disabling it and
# providing MINIO_ENDPOINT/MINIO_ACCESS_KEY/MINIO_SECRET_KEY.
minio:
  enabled: true
  distributedNodes: 4
  bucket: olympus
  region: ""
  accessKey: olympus_admin
  secretKey: olympus_secret_admin
  storageSize: 10Gi
  storageClass: ""
  persistence:
    enabled: true
  service:
    port: 9000