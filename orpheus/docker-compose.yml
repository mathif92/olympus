version: '3.8'

services:
  # PostgreSQL - relational storage for multi-tenant managed-Kubernetes state and audit log.
  postgres:
    image: postgres:16-alpine
    container_name: orpheus-postgres
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_secret
      POSTGRES_DB: olympus_orchestration
    ports:
      - "15435:5432"
    volumes:
      - orpheus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus_orchestration"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  orpheus-postgres-data:
    driver: local