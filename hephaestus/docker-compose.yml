version: '3.8'

services:
  # PostgreSQL - relational storage for multi-tenant compute state and audit log.
  postgres:
    image: postgres:16-alpine
    container_name: hephaestus-postgres
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_secret
      POSTGRES_DB: olympus_compute
    ports:
      - "15434:5432"
    volumes:
      - hephaestus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus_compute"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hephaestus-postgres-data:
    driver: local