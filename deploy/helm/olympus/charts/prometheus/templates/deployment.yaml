apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prometheus.fullname" . }}
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "prometheus.saName" . }}
      {{- if eq .Values.provisioner "docker" }}
      volumes:
        - name: docker-socket
          hostPath:
            path: {{ .Values.dockerHostSocket }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: POSTGRES_DSN
              value: {{ include "prometheus.postgresDsn" . | quote }}
            - name: THEMIS_URL
              value: {{ include "prometheus.themisUrl" . | quote }}
            - name: THEMIS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-olympus-secrets
                  key: THEMIS_JWT_SECRET
            - name: PROVISIONER
              value: {{ .Values.provisioner | quote }}
            - name: PROMETHEUS_IMAGE_PREFIX
              value: {{ .Values.imagePrefix | quote }}
            {{- if eq .Values.provisioner "docker" }}
            - name: DOCKER_HOST
              value: {{ printf "unix://%s" .Values.dockerHostSocket | quote }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- if eq .Values.provisioner "docker" }}
          volumeMounts:
            - name: docker-socket
              mountPath: {{ .Values.dockerHostSocket }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}