apiVersion: v1
kind: Service
metadata:
  name: {{ include "paramdora.fullname" . }}
  labels:
    {{- include "paramdora.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "paramdora.selectorLabels" . | nindent 4 }}