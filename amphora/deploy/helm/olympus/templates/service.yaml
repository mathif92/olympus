apiVersion: v1
kind: Service
metadata:
  name: {{ include "olympus.fullname" . }}-gateway
  labels:
    {{- include "olympus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "olympus.selectorLabels" . | nindent 4 }}
    component: gateway
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http