{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "olympus.fullname" . }}-minio
  labels:
    app: minio
    {{- include "olympus.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "olympus.fullname" . }}-minio
  replicas: {{ .Values.minio.distributedNodes }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: minio
      {{- include "olympus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: minio
        {{- include "olympus.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          imagePullPolicy: IfNotPresent
          # Distributed server mode; each replica owns a PVC for its data.
          command: ["/bin/sh", "-c"]
          args:
            - |-
              minio server --console-address :9001 {{ include "olympus.minioServerList" . }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.accessKey | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.secretKey | quote }}
            {{- if .Values.minio.region }}
            - name: MINIO_REGION
              value: {{ .Values.minio.region | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 20
  {{- if .Values.minio.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.minio.storageClass }}
        storageClassName: {{ .Values.minio.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.minio.storageSize }}
  {{- end }}
{{- end }}