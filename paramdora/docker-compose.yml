version: '3.8'

services:
  # PostgreSQL - relational storage for multi-tenant parameters and audit log.
  postgres:
    image: postgres:16-alpine
    container_name: paramdora-postgres
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_secret
      POSTGRES_DB: olympus_parameters
    ports:
      - "15433:5432"
    volumes:
      - paramdora-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus_parameters"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  paramdora-postgres-data:
    driver: local