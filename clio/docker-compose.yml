version: '3.8'

services:
  # PostgreSQL - relational storage for multi-tenant managed-database state and audit log.
  postgres:
    image: postgres:16-alpine
    container_name: clio-postgres
    environment:
      POSTGRES_USER: olympus
      POSTGRES_PASSWORD: olympus_secret
      POSTGRES_DB: olympus_databases
    ports:
      - "15436:5432"
    volumes:
      - clio-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olympus -d olympus_databases"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  clio-postgres-data:
    driver: local